    status_stored: "Guardada"
    btn_storage: "<white>Almacenamiento</white>"
    btn_colosseum: "<white>Coliseo</white>"
    btn_guide: "<white>Guia de Mascotas</white>"
    btn_skilltree: "<white>Arbol de Habilidades</white>"
    btn_backpack: "<white>Mochila de Mascota</white>"
    btn_summon: "<green>Invocar</green>"
    btn_despawn: "<red>Desinvocar</red>"
    btn_close: "<white>Cerrar</white>"

  storage:
    title: "<white>Almacenamiento de Mascotas</white>"
