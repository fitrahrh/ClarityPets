    btn_switch: "<white>Cambiar Arbol</white>"
    btn_reset: "<red>Reiniciar Puntos</red>"
    btn_back: "<white>Volver</white>"

  skill_detail:
    title: "<white>Habilidad: <skill></white>"
    body: "<white>Categoria: <category></white><newline><white><desc></white><newline><newline><white>Nivel Actual: <tier>/<max></white><newline><white>Efecto Actual: <current_effect></white><newline><newline><white>Siguiente Nivel: <next_effect></white><newline><newline><white>Puntos Disponibles: <points></white>"
    maxed: "Nivel Maximo Alcanzado"
    btn_upgrade: "<green>Mejorar (1 Punto)</green>"
    btn_back: "<white>Volver</white>"

  switch_tree:
    title: "<white>Cambiar Arbol de Habilidades</white>"
    body: "<white>Arquetipo Actual: <current_tree></white><newline><newline><white>Cambiar de arquetipo reembolsara todos los puntos gastados y desbloqueara un nuevo conjunto de habilidades.</white>"
    btn_tree: "<white><tree></white>"
    btn_back: "<white>Volver</white>"

  reset_points:
    title: "<white>Reiniciar Puntos de Habilidad</white>"
    body: "<white>Estas seguro de que deseas reembolsar todos los puntos de habilidad? Todas las habilidades volveran a Nivel 0.</white>"
    btn_confirm: "<red>Reiniciar Puntos</red>"
    btn_cancel: "<white>Cancelar</white>"

