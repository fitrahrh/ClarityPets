    btn_next: "<white>Pagina Siguiente</white>"
    btn_back: "<white>Volver</white>"

  detail:
    title: "<white>Detalles de la Mascota</white>"
    body: "<white>Nombre: <name></white><newline><white>Tipo: <type></white><newline><white>Categoria: <category></white><newline><white>Nivel: <level></white><newline><white>Experiencia: <exp>/<max_exp></white><newline><white>Vida: <hp>/<max_hp></white><newline><white>Ataque: <atk></white><newline><white>Defensa: <def></white><newline><white>Velocidad: <spd></white><newline><newline><white>Arbol: <skilltree></white><newline><white>Puntos de Habilidad: <skill_points></white><newline><newline><white>Comportamiento: <mode></white><newline><white><mode_desc></white><newline><newline><white>Habilidad Pasiva: <passive_name></white><newline><white><passive_desc></white><newline><newline><white>Habilidad Activa: <active_skill_name></white><newline><white><active_desc></white>"
    btn_summon: "<green>Invocar</green>"
    btn_despawn: "<red>Desinvocar</red>"
    btn_skilltree: "<white>Arbol de Habilidades</white>"
    btn_backpack: "<white>Mochila de Mascota</white>"
