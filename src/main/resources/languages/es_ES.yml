    btn_treat: "<white>Alimentar Bocadillo (<daily_left> restantes)</white>"
    btn_rename: "<white>Renombrar Mascota</white>"
    btn_guide: "<white>Guia de Mascotas</white>"
    btn_release: "<red>Liberar Mascota</red>"
    btn_back: "<white>Volver</white>"

  mode:
    title: "<white>Seleccionar Modo de Comportamiento</white>"
    body: "<white>Modo Actual: <current_mode></white><newline><white><current_mode_desc></white><newline><newline><white>Pasivo: Sigue pacificamente, nunca ataca.</white><newline><white>Defensivo: Te defiende contra atacantes.</white><newline><white>Agresivo: Caza monstruos y te defiende con fiereza.</white><newline><white>Centinela: Vigila la posicion actual.</white>"
    btn_passive: "<white>Pasivo</white>"
    btn_defensive: "<white>Defensivo</white>"
    btn_aggressive: "<white>Agresivo</white>"
    btn_sentry: "<white>Centinela</white>"
    btn_back: "<white>Volver</white>"

  guide:
    title: "<white>Guia de Mascotas</white>"
    body: "<white>Bienvenido a la Guia de ClarityPets.</white><newline><white>Selecciona una categoria para conocer las mecanicas, el entrenamiento y el Coliseo.</white>"
    btn_basics: "<white>Basicos y Controles</white>"
    btn_leveling: "<white>Niveles y Bocadillos</white>"
    btn_skills: "<white>Habilidades y Arboles</white>"
    btn_modes: "<white>Modos de Comportamiento</white>"
    btn_colosseum: "<white>Arena del Coliseo</white>"
    btn_back: "<white>Volver</white>"
    basics_title: "<white>Guia: Basicos</white>"
    basics_body: "<white>Conceptos Basicos:</white><newline><white>Puedes tener varias mascotas en almacenamiento, pero solo 1 invocada a la vez.</white><newline><newline><white>Invocacion:</white><newline><white>Usa el menu de Almacenamiento para invocar tu companero al mundo o guardarlo cuando quieras.</white><newline><newline><white>Personalizacion:</white><newline><white>Puedes cambiar el nombre de tu mascota en cualquier momento desde el menu de Detalles.</white>"
    leveling_title: "<white>Guia: Niveles</white>"
    leveling_body: "<white>Obtener Experiencia:</white><newline><white>Tu mascota gana EXP mediante actividades de supervivencia:</white><newline><white>- Cazar monstruos: Derrotar monstruos otorga EXP.</white><newline><white>- Mineria: Picar minerales otorga EXP.</white><newline><white>- Talar madera: Talar arboles otorga EXP.</white><newline><white>- Pesca: Pescar otorga EXP.</white><newline><newline><white>Bocadillos Diarios:</white><newline><white>Alimenta a tu mascota con bocadillos diarios en el menu de Detalles para obtener EXP rapida.</white>"
    skills_title: "<white>Guia: Habilidades y Arboles</white>"
    skills_body: "<white>Arboles de Habilidades y Entrenables:</white><newline><white>Cada mascota pertenece a un Arquetipo: Juggernaut (Combate), Guardian (Soporte) o Scavenger (Utilidad).</white><newline><newline><white>Puntos de Habilidad:</white><newline><white>Tu mascota gana 1 Punto de Habilidad cada vez que sube de nivel. Mejora habilidades hasta Nivel 5.</white><newline><newline><white>Arquetipos y Habilidades:</white><newline><white>- Juggernaut: Damage, Life, Armor, Thorns, Bleed, Fire, Knockback, Earthquake Stomp.</white><newline><white>- Guardian: Life, Armor, Heal, Beacon, Aegis Shield, Provocation, Slow, Poison, Wither, Emergency Potion.</white><newline><white>- Scavenger: Pack Mule Mochila, Item Fetcher Recoleccion, Swift Trot Velocidad, Mineria, Tala de Madera, Pesca, Camuflaje.</white><newline><newline><white>Cambio de Arbol:</white><newline><white>Puedes cambiar libremente de arquetipo en cualquier momento; se reembolsan todos los puntos gastados.</white>"
    modes_title: "<white>Guia: Modos</white>"
    modes_body: "<white>Modos de Comportamiento:</white><newline><white>Puedes cambiar el comportamiento de tu mascota en cualquier momento:</white><newline><newline><white>Modo Pasivo:</white><newline><white>Tu mascota te sigue tranquilamente sin atacar.</white><newline><newline><white>Modo Defensivo:</white><newline><white>Tu mascota contraataca a cualquier criatura que te dane a ti o a ella.</white><newline><newline><white>Modo Centinela:</white><newline><white>Tu mascota vigila su posicion actual atacando a intrusos hostiles.</white>"
    colosseum_title: "<white>Guia: Coliseo</white>"
    colosseum_body: "<white>Duelos Automaticos en el Coliseo:</white><newline><white>Desafia a otros jugadores. Las mascotas luchan solas segun sus atributos y habilidades.</white><newline><newline><white>Ventajas de Categoria:</white><newline><white>- Mascotas de Combate hacen +20 por ciento de dano a Utilidad.</white><newline><white>- Mascotas de Utilidad hacen +20 por ciento de dano a Soporte.</white><newline><white>- Mascotas de Soporte hacen +20 por ciento de dano a Combate.</white><newline><newline><white>Posturas Tacticas:</white><newline><white>- Agresiva: +15 por ciento Ataque, -10 por ciento Defensa.</white><newline><white>- Defensiva: +20 por ciento Defensa, mayor contraataque.</white><newline><white>- Equilibrada: Atributos equilibrados estandar.</white>"

  rename:
    title: "<white>Renombrar Mascota</white>"
    body: "<white>Introduce un nuevo nombre para tu mascota abajo.</white>"
    input_label: "<white>Nombre de la Mascota</white>"
