prefix: "<gray>[<aqua>ClarityPets</aqua>]</gray> "

category:
  combat: "Combate"
  utility: "Utilidad"
  support: "Soporte"

mode:
  passive: "Pasivo"
  defensive: "Defensivo"
  aggressive: "Agresivo"
  sentry: "Centinela"
  pocket: "Guardado"

mode_desc:
  passive: "Te sigue pacificamente, nunca ataca a ninguna entidad."
  defensive: "Te sigue de cerca y contraataca a los enemigos que te ataquen."
  aggressive: "Caza proactivamente monstruos cercanos y defiende al amo agresivamente."
  sentry: "Vigila la posicion actual atacando a los monstruos cercanos."
  pocket: "Inactiva en almacenamiento."

pet:
  nametag_format: "<white><name></white> <gray>[Nv.<level>]</gray>"

