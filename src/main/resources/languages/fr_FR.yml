    btn_tree: "<white><tree></white>"
    btn_back: "<white>Retour</white>"

  reset_points:
    title: "<white>Reinitialiser les Points</white>"
    body: "<white>Etes-vous sur de vouloir reinitialiser vos points de competence ? Toutes les aptitudes repasseront au Rang 0.</white>"
    btn_confirm: "<red>Reinitialiser Tous les Points</red>"
    btn_cancel: "<white>Annuler</white>"

