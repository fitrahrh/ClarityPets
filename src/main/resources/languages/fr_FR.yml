  guide:
    title: "<white>Guide des Familiers</white>"
    body: "<white>Bienvenue dans le Guide ClarityPets.</white><newline><white>Selectionnez une rubrique ci-dessous pour decouvrir les mecaniques, l entrainement et le Colisee.</white>"
    btn_basics: "<white>Bases & Commandes</white>"
    btn_leveling: "<white>Niveaux & Friandises</white>"
    btn_skills: "<white>Competences & Arbres</white>"
    btn_modes: "<white>Modes de Comportement</white>"
    btn_colosseum: "<white>Arene du Colisee</white>"
    btn_back: "<white>Retour</white>"
    basics_title: "<white>Guide: Bases</white>"
    basics_body: "<white>Principes de base:</white><newline><white>Vous pouvez posseder plusieurs familiers, mais 1 seul peut etre invoque a la fois.</white><newline><newline><white>Invocation & Stockage:</white><newline><white>Utilisez le stockage pour appeler votre familier ou le renvoyer a tout moment.</white><newline><newline><white>Personnalisation:</white><newline><white>Renommez votre compagnon depuis le menu des details.</white>"
    leveling_title: "<white>Guide: Niveaux</white>"
    leveling_body: "<white>Gain d experience:</white><newline><white>Votre compagnon gagne de l EXP via vos activites de survie:</white><newline><white>- Chasse aux monstres: Vaincre des monstres donne de l EXP.</white><newline><white>- Minage: Miner des minerais donne de l EXP.</white><newline><white>- Bucheron: Couper des arbres donne de l EXP.</white><newline><white>- Peche: Pecher donne de l EXP.</white><newline><newline><white>Friandises Quotidiennes:</white><newline><white>Donnez des friandises quotidiennes pour un boost instantane d EXP.</white>"
    skills_title: "<white>Guide: Competences</white>"
    skills_body: "<white>Arbres de Competences et Entrainement:</white><newline><white>Chaque familier appartient a un Archetype: Juggernaut (Combat), Guardian (Soutien) ou Scavenger (Utilitaire).</white><newline><newline><white>Points de Competence:</white><newline><white>Votre familier gagne 1 Point a chaque niveau franchi. Ameliorez les competences jusqu au Rang 5.</white><newline><newline><white>Changement d Arbre:</white><newline><white>Vous pouvez changer d archetype a tout moment. Tous les points investis sont automatiquement rembourses.</white>"
    modes_title: "<white>Guide: Comportement</white>"
    modes_body: "<white>Modes de Comportement:</white><newline><white>Ajustez les actions de votre familier a tout moment:</white><newline><newline><white>Mode Passif:</white><newline><white>Votre compagnon vous suit tranquillement sans attaquer.</white><newline><newline><white>Mode Defensif:</white><newline><white>Votre compagnon riposte contre toute entite qui vous attaque.</white><newline><newline><white>Mode Sentinelle:</white><newline><white>Votre compagnon garde le secteur et repousse les intrus.</white>"
    colosseum_title: "<white>Guide: Colisee</white>"
    colosseum_body: "<white>Duels Automatiques du Colisee:</white><newline><white>Defiez d autres joueurs dans l arene. Les familiers combattent automatiquement.</white><newline><newline><white>Avantages de Categorie:</white><newline><white>- Combat inflige +20 pour cent de degats a Utilitaire.</white><newline><white>- Utilitaire inflige +20 pour cent de degats a Soutien.</white><newline><white>- Soutien inflige +20 pour cent de degats a Combat.</white><newline><newline><white>Postures Tactiques:</white><newline><white>- Offensive: +15 pour cent d Attaque, -10 pour cent de Defense.</white><newline><white>- Defensive: +20 pour cent de Defense, meilleur taux de riposte.</white><newline><white>- Equilibree: Statistiques de combat equilibrees.</white>"

