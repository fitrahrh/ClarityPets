prefix: "<gray>[<aqua>ClarityPets</aqua>]</gray> "

category:
  combat: "Боевой"
  utility: "Утилитарный"
  support: "Поддержка"

mode:
  passive: "Пассивный"
  defensive: "Защитный"
  sentry: "Часовой"
  pocket: "В хранилище"

mode_desc:
  passive: "Мирно следует за хозяином и никогда никого не атакует."
  defensive: "Верно следует рядом и контратакует любого, кто нападает на вас или питомца."
  sentry: "Охраняет текущую позицию и атакует враждебных мобов в радиусе охраны."
  pocket: "Неактивен в хранилище."

pet:
  nametag_format: "<white><name></white> <gray>[Ур.<level>]</gray>"

dialog:
