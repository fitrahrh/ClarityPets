    btn_skill: "<white><skill> [Nivel <tier>/<max>]</white>"
    btn_switch: "<white>Mudar Arvore</white>"
    btn_reset: "<red>Resetar Pontos</red>"
    btn_back: "<white>Voltar</white>"

  skill_detail:
    title: "<white>Habilidade: <skill></white>"
    body: "<white>Categoria: <category></white><newline><white><desc></white><newline><newline><white>Nivel Atual: <tier>/<max></white><newline><white>Efeito Atual: <current_effect></white><newline><newline><white>Proximo Nivel: <next_effect></white><newline><newline><white>Pontos Disponiveis: <points></white>"
    maxed: "Nivel Maximo Atingido"
    btn_upgrade: "<green>Melhorar (1 Ponto)</green>"
    btn_back: "<white>Voltar</white>"

  switch_tree:
    title: "<white>Trocar Arvore de Habilidades</white>"
    body: "<white>Arquetipo Atual: <current_tree></white><newline><newline><white>Trocar de arquetipo ira reembolsar todos os pontos gastos e desbloquear um novo conjunto de habilidades.</white>"
    btn_tree: "<white><tree></white>"
    btn_back: "<white>Voltar</white>"

  reset_points:
    title: "<white>Resetar Pontos de Habilidade</white>"
    body: "<white>Tem certeza de que deseja reembolsar todos os pontos de habilidade? Todas as habilidades voltarao ao Nivel 0.</white>"
    btn_confirm: "<red>Resetar Pontos</red>"
    btn_cancel: "<white>Cancelar</white>"

