    btn_defensive: "<white>Defensivo</white>"
    btn_sentry: "<white>Sentinela</white>"
    btn_back: "<white>Voltar</white>"

  guide:
    title: "<white>Guia de Pets</white>"
    body: "<white>Bem-vindo ao Guia do ClarityPets.</white><newline><white>Selecione uma categoria abaixo para entender as mecanicas, niveis e o Coliseu.</white>"
    btn_basics: "<white>Basico e Comandos</white>"
    btn_leveling: "<white>Niveis e Petiscos</white>"
    btn_skills: "<white>Habilidades e Arvores</white>"
    btn_modes: "<white>Modos de Comportamento</white>"
    btn_colosseum: "<white>Arena do Coliseu</white>"
    btn_back: "<white>Voltar</white>"
    basics_title: "<white>Guia: Basico</white>"
    basics_body: "<white>Conceitos Basicos:</white><newline><white>Voce pode guardar varios pets, mas apenas 1 ativo pode ser invocado de cada vez.</white><newline><newline><white>Invocacao:</white><newline><white>Use o Armazenamento para inspecionar e invocar seu pet ou recolhe-lo quando quiser.</white><newline><newline><white>Personalizacao:</white><newline><white>Renomeie seu pet a qualquer momento pelo menu de Detalhes.</white>"
    leveling_title: "<white>Guia: Niveis</white>"
    leveling_body: "<white>Ganhando Experiencia:</white><newline><white>Seu pet ganha EXP naturalmente atraves de acoes de sobrevivencia:</white><newline><white>- Caca a monstros: Derrotar monstros concede EXP.</white><newline><white>- Mineracao: Minerar minerios concede EXP.</white><newline><white>- Lenhador: Cortar arvores concede EXP.</white><newline><white>- Pesca: Pescar concede EXP.</white><newline><newline><white>Petiscos Diarios:</white><newline><white>Alimente seu pet com petiscos diariamente para receber EXP instantanea.</white>"
    skills_title: "<white>Guia: Habilidades e Arvores</white>"
    skills_body: "<white>Arvores de Habilidades e Treinamento:</white><newline><white>Cada pet possui um Arquetipo: Juggernaut (Combate), Guardian (Suporte) ou Scavenger (Utilidade).</white><newline><newline><white>Pontos de Habilidade:</white><newline><white>Seu pet ganha 1 Ponto de Habilidade a cada nivel alcancado. Melhore habilidades ate o Nivel 5.</white><newline><newline><white>Arquetipos e Habilidades:</white><newline><white>- Juggernaut: Damage, Life, Armor, Thorns, Bleed, Fire, Knockback, Earthquake Stomp.</white><newline><white>- Guardian: Life, Armor, Heal, Beacon, Aegis Shield, Provocation, Slow, Poison, Wither, Emergency Potion.</white><newline><white>- Scavenger: Pack Mule Mochila, Item Fetcher Coleta, Swift Trot Velocidade, Mineracao, Lenhador, Pesca, Camuflagem.</white><newline><newline><white>Troca de Arvore:</white><newline><white>Voce pode alterar o arquetipo livremente a qualquer momento. A troca reembolsa todos os pontos investidos.</white>"
    modes_title: "<white>Guia: Modos</white>"
    modes_body: "<white>Modos de Comportamento:</white><newline><white>Ajuste as acoes do seu pet quando desejar:</white><newline><newline><white>Modo Passivo:</white><newline><white>Seu pet o segue tranquilamente sem nunca atacar.</white><newline><newline><white>Modo Defensivo:</white><newline><white>Seu pet ataca de volta qualquer inimigo que cause dano a voce ou a ele.</white><newline><newline><white>Modo Sentinela:</white><newline><white>Seu pet guarda a area atual atacando monstros invasores.</white>"
    colosseum_title: "<white>Guia: Coliseu</white>"
    colosseum_body: "<white>Duelos Automaticos do Coliseu:</white><newline><white>Desafie outros jogadores na arena. Os pets batalham sozinhos conforme seus atributos.</white><newline><newline><white>Vantagens de Categoria:</white><newline><white>- Pets Combat causam +20 por cento dano em Utility.</white><newline><white>- Pets Utility causam +20 por cento dano em Support.</white><newline><white>- Pets Support causam +20 por cento dano em Combat.</white><newline><newline><white>Posturas:</white><newline><white>- Aggressive: +15 por cento Ataque, -10 por cento Defesa.</white><newline><white>- Defensive: +20 por cento Defesa, contra-ataque maior.</white><newline><white>- Balanced: Atributos equilibrados normais.</white>"

  rename:
    title: "<white>Renomear Pet</white>"
    body: "<white>Digite um novo nome para o seu pet abaixo.</white>"
    input_label: "<white>Nome do Pet</white>"
    btn_confirm: "<green>Confirmar</green>"
    btn_cancel: "<red>Cancelar</red>"

