    body: "<white>Agressivo: +15 por cento de Ataque, -10 por cento de Defesa</white><newline><white>Defensivo: +20 por cento de Defesa, maior taxa de contra-ataque</white><newline><white>Equilibrado: Estatisticas de combate normais e equilibradas</white>"
    btn_aggressive: "<white>Agressivo</white>"
    btn_defensive: "<white>Defensivo</white>"
    btn_balanced: "<white>Equilibrado</white>"
    btn_back: "<white>Voltar</white>"

