    title: "<white>Manajemen Pet</white>"
    body: "<white>Pet Aktif: <active_name> (Level <active_level>)</white><newline><white>Status: <active_status></white><newline><white>Total Pet: <total_pets></white>"
    none: "Tidak Ada"
    status_stored: "Tersimpan"
    btn_storage: "<white>Penyimpanan Pet</white>"
    btn_colosseum: "<white>Colosseum</white>"
    btn_guide: "<white>Panduan Pet</white>"
    btn_skilltree: "<white>Skilltree & Skill</white>"
    btn_backpack: "<white>Tas Ransel Pet</white>"
    btn_summon: "<green>Summon</green>"
    btn_despawn: "<red>Despawn</red>"
    btn_close: "<white>Tutup</white>"

  storage:
    title: "<white>Penyimpanan Pet</white>"
    body: "<white>Halaman <page> dari <total_pages> | Total Pet: <total_pets></white>"
    btn_pet: "<white><name> Lv.<level></white>"
    btn_prev: "<white>Halaman Sebelumnya</white>"
    btn_next: "<white>Halaman Berikutnya</white>"
    btn_back: "<white>Kembali</white>"

  detail:
    title: "<white>Detail Pet</white>"
    body: "<white>Nama: <name></white><newline><white>Tipe: <type></white><newline><white>Kategori: <category></white><newline><white>Level: <level></white><newline><white>Pengalaman: <exp>/<max_exp></white><newline><white>Darah: <hp>/<max_hp></white><newline><white>Serangan: <atk></white><newline><white>Pertahanan: <def></white><newline><white>Kecepatan: <spd></white><newline><newline><white>Skilltree: <skilltree></white><newline><white>Poin Skill: <skill_points></white><newline><newline><white>Perilaku: <mode></white><newline><white><mode_desc></white><newline><newline><white>Skill Pasif: <passive_name></white><newline><white><passive_desc></white><newline><newline><white>Skill Aktif: <active_skill_name></white><newline><white><active_desc></white>"
    btn_summon: "<green>Summon</green>"
    btn_despawn: "<red>Despawn</red>"
    btn_skilltree: "<white>Skilltree & Skill</white>"
    btn_backpack: "<white>Tas Ransel Pet</white>"
    btn_mode: "<white>Ganti Mode</white>"
    btn_treat: "<white>Beri Makan Treat (Sisa <daily_left>)</white>"
    btn_rename: "<white>Ganti Nama Pet</white>"
    btn_guide: "<white>Panduan Pet</white>"
    btn_release: "<red>Lepaskan Pet</red>"
    btn_back: "<white>Kembali</white>"

  mode:
    title: "<white>Pilih Mode Perilaku</white>"
    body: "<white>Mode Saat Ini: <current_mode></white><newline><white><current_mode_desc></white><newline><newline><white>Pasif: Mengikuti damai, tidak pernah menyerang.</white><newline><white>Defensif: Membela Anda dari penyerang.</white><newline><white>Agresif: Memburu monster sekitar dan membela Anda.</white><newline><white>Penjaga: Berjaga di lokasi saat ini.</white>"
    btn_passive: "<white>Pasif</white>"
    btn_defensive: "<white>Defensif</white>"
    btn_aggressive: "<white>Agresif</white>"
    btn_sentry: "<white>Penjaga</white>"
    btn_back: "<white>Kembali</white>"

  guide:
    title: "<white>Panduan Pet</white>"
    body: "<white>Selamat datang di Panduan ClarityPets.</white><newline><white>Pilih kategori di bawah untuk mempelajari mekanik pet, leveling, mode perilaku, dan duel Colosseum.</white>"
    btn_basics: "<white>Dasar & Kontrol</white>"
    btn_leveling: "<white>Leveling & Treats</white>"
    btn_skills: "<white>Skill & Pohon Skill</white>"
    btn_modes: "<white>Mode Perilaku</white>"
    btn_colosseum: "<white>Arena Colosseum</white>"
    btn_back: "<white>Kembali</white>"
    basics_title: "<white>Panduan: Dasar</white>"
    basics_body: "<white>Dasar Pet:</white><newline><white>Anda dapat mengoleksi banyak pet di penyimpanan, namun hanya 1 pet yang dapat di-summon pada satu waktu.</white><newline><newline><white>Summon & Penyimpanan:</white><newline><white>Gunakan menu Penyimpanan Pet untuk memeriksa detail dan memanggil pet ke dunia. Anda dapat mengembalikan pet ke penyimpanan kapan saja.</white><newline><newline><white>Kustomisasi:</white><newline><white>Anda dapat mengubah nama pet kapan saja melalui menu Detail Pet.</white>"
    leveling_title: "<white>Panduan: Leveling</white>"
    leveling_body: "<white>Mendapatkan EXP:</white><newline><white>Pet aktif mendapatkan EXP secara alami dari aktivitas survival:</white><newline><white>- Berburu monster: Mengalahkan monster memberikan EXP.</white><newline><white>- Menambang: Menambang ore memberikan bonus EXP.</white><newline><white>- Menebang kayu: Menebang pohon memberikan bonus EXP.</white><newline><white>- Memancing: Menangkap ikan memberikan bonus EXP.</white><newline><newline><white>Daily Treats:</white><newline><white>Beri makan pet treat setiap hari pada menu Detail Pet untuk tambahan EXP instan. Daily treat di-reset setiap hari.</white>"
    skills_title: "<white>Panduan: Skill & Skilltree</white>"
    skills_body: "<white>Skilltree & Skill yang Dapat Dilatih:</white><newline><white>Setiap pet memiliki Arketipe: Juggernaut (Combat), Guardian (Support), atau Scavenger (Utility).</white><newline><newline><white>Mendapatkan Poin Skill:</white><newline><white>Pet Anda mendapatkan 1 Poin Skill setiap kali naik level. Gunakan poin untuk meningkatkan kemampuan hingga Tier 5.</white><newline><newline><white>Arketipe & Skill:</white><newline><white>- Juggernaut: Damage, Life, Armor, Thorns, Bleed, Fire, Knockback, Earthquake Stomp.</white><newline><white>- Guardian: Life, Armor, Heal, Beacon, Aegis Shield, Provocation, Slow, Poison, Wither, Emergency Potion.</white><newline><white>- Scavenger: Pack Mule Backpack, Item Fetcher Pickup, Swift Trot Sprint, Ore Mining, Timber Lumberjack, Angler Fishing, Shadow Veil Camouflage.</white><newline><newline><white>Ganti Arketipe:</white><newline><white>Anda dapat bebas mengganti arketipe skilltree kapan saja. Pergantian arketipe akan mengembalikan seluruh poin yang telah diinvestasikan.</white>"
    modes_title: "<white>Panduan: Mode Perilaku</white>"
    modes_body: "<white>Mode Perilaku:</white><newline><white>Anda dapat mengatur cara bertindak pet kapan saja:</white><newline><newline><white>Mode Passive:</white><newline><white>Pet mengikuti Anda dengan tenang dan tidak akan pernah menyerang target.</white><newline><newline><white>Mode Defensive:</white><newline><white>Pet mengikuti Anda dan langsung menyerang balik entitas yang melukai Anda atau pet.</white><newline><newline><white>Mode Sentry:</white><newline><white>Pet berjaga di lokasi saat ini, menyerang monster berbahaya di sekitar dan kembali ke titik pos.</white>"
    colosseum_title: "<white>Panduan: Colosseum</white>"
    colosseum_body: "<white>Duel Otomatis Colosseum:</white><newline><white>Tantang pemain lain dalam duel otomatis di arena. Pet akan bertarung secara mandiri berdasarkan status, skill, dan taktik.</white><newline><newline><white>Keunggulan Kategori:</white><newline><white>- Pet Combat memberikan +20 persen damage ke pet Utility.</white><newline><white>- Pet Utility memberikan +20 persen damage ke pet Support.</white><newline><white>- Pet Support memberikan +20 persen damage ke pet Combat.</white><newline><newline><white>Stance Taktis:</white><newline><white>- Aggressive: +15 persen Attack, -10 persen Defense.</white><newline><white>- Defensive: +20 persen Defense, peluang counter lebih tinggi.</white><newline><white>- Balanced: Status bertarung seimbang standar.</white>"

  rename:
    title: "<white>Ganti Nama Pet</white>"
    body: "<white>Ketik nama baru untuk pet Anda di bawah ini.</white>"
    input_label: "<white>Nama Pet</white>"
    btn_confirm: "<green>Konfirmasi</green>"
    btn_cancel: "<red>Batal</red>"

