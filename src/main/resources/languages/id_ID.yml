prefix: "<gray>[<aqua>ClarityPets</aqua>]</gray> "

category:
  combat: "Combat"
  utility: "Utility"
  support: "Support"

mode:
  passive: "Pasif"
  defensive: "Defensif"
  aggressive: "Agresif"
  sentry: "Penjaga"
  pocket: "Tersimpan"

mode_desc:
  passive: "Mengikuti Anda dengan damai. Tidak akan pernah menyerang monster atau pemain lain."
  defensive: "Mengikuti Anda dengan setia. Membela Anda dengan menyerang balik target yang menyerang Anda atau pet."
  aggressive: "Secara proaktif memburu monster liar di sekitar dan membela majikan dengan ganas."
  sentry: "Menjaga pos/lokasi saat ini. Menyerang monster liar yang masuk area dan kembali ke pos setelah pertarungan."
  pocket: "Tidak aktif dalam penyimpanan."

pet:
  nametag_format: "<white><name></white> <gray>[Lv.<level>]</gray>"

dialog:
