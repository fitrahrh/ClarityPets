    body: "<white>Rekor Duel: <wins> Menang, <losses> Kalah, <draws> Seri</white><newline><white>Kemenangan Beruntun: <streak></white><newline><white>Rating Arena: <rating></white><newline><white>Stance Taktik: <stance></white>"
    btn_stance: "<white>Ganti Stance</white>"
    btn_challenge: "<white>Tantang Pemain</white>"
    btn_back: "<white>Kembali</white>"

  stance:
    title: "<white>Pilih Stance Taktik</white>"
    body: "<white>Agresif: +15 persen Serangan, -10 persen Pertahanan</white><newline><white>Defensif: +20 persen Pertahanan, peluang counter lebih tinggi</white><newline><white>Seimbang: Statistik pertarungan normal seimbang</white>"
    btn_aggressive: "<white>Agresif</white>"
    btn_defensive: "<white>Defensif</white>"
    btn_balanced: "<white>Seimbang</white>"
    btn_back: "<white>Kembali</white>"

  challenge:
    title: "<white>Pilih Lawan</white>"
    body: "<white>Pilih pemain online untuk ditantang dalam duel otomatis di Colosseum.</white>"
    btn_player: "<white><player> (<pet_name> Lv.<pet_level>)</white>"
    btn_back: "<white>Kembali</white>"

  skilltree:
