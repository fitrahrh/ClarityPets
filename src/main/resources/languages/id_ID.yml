    btn_skill: "<white><skill> [Tier <tier>/<max>]</white>"
    btn_switch: "<white>Ganti Skilltree</white>"
    btn_reset: "<red>Reset Poin</red>"
    btn_back: "<white>Kembali</white>"

  skill_detail:
    title: "<white>Skill: <skill></white>"
    body: "<white>Kategori: <category></white><newline><white><desc></white><newline><newline><white>Tier Saat Ini: <tier>/<max></white><newline><white>Efek Saat Ini: <current_effect></white><newline><newline><white>Tier Berikutnya: <next_effect></white><newline><newline><white>Poin Skill Tersedia: <points></white>"
    maxed: "Tingkat Maksimal Tercapai"
    btn_upgrade: "<green>Tingkatkan (1 Poin)</green>"
    btn_back: "<white>Kembali</white>"

  switch_tree:
    title: "<white>Ganti Skilltree</white>"
    body: "<white>Arketipe Saat Ini: <current_tree></white><newline><newline><white>Mengganti arketipe akan mengembalikan seluruh poin skill dan membuka keahlian baru.</white>"
    btn_tree: "<white><tree></white>"
    btn_back: "<white>Kembali</white>"

  reset_points:
    title: "<white>Reset Poin Skill</white>"
    body: "<white>Apakah Anda yakin ingin mengembalikan seluruh poin skill? Semua kemampuan akan di-reset ke Tier 0.</white>"
    btn_confirm: "<red>Reset Semua Poin</red>"
    btn_cancel: "<white>Batal</white>"

