    body: "<white>Apakah Anda yakin ingin melepaskan <name>? Tindakan ini tidak dapat dibatalkan.</white>"
    btn_confirm: "<red>Konfirmasi Lepas</red>"
    btn_cancel: "<white>Batal</white>"

