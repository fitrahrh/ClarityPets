    btn_stance: "<white>切换姿态</white>"
    btn_challenge: "<white>挑战玩家</white>"
    btn_back: "<white>返回</white>"

  stance:
    title: "<white>选择战术姿态</white>"
    body: "<white>进攻姿态: +15 百分比攻击力, -10 百分比防御力</white><newline><white>防守姿态: +20 百分比防御力, 提高反击几率</white><newline><white>平衡姿态: 标准均衡战斗属性</white>"
    btn_aggressive: "<white>进攻姿态</white>"
    btn_defensive: "<white>防守姿态</white>"
    btn_balanced: "<white>平衡姿态</white>"
    btn_back: "<white>返回</white>"

  challenge:
    title: "<white>选择对手</white>"
    body: "<white>选择一名在线玩家发起角斗场自动决斗挑战。</white>"
    btn_player: "<white><player> (<pet_name> Lv.<pet_level>)</white>"
    btn_back: "<white>返回</white>"

  skilltree:
    title: "<white>技能树 - <name></white>"
