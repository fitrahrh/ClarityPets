    btn_skill: "<white><skill> [阶级 <tier>/<max>]</white>"
    btn_switch: "<white>切换流派</white>"
    btn_reset: "<red>重置点数</red>"
    btn_back: "<white>返回</white>"

  skill_detail:
    title: "<white>特技: <skill></white>"
    body: "<white>类别: <category></white><newline><white><desc></white><newline><newline><white>当前阶级: <tier>/<max></white><newline><white>当前效果: <current_effect></white><newline><newline><white>下一阶级: <next_effect></white><newline><newline><white>可用技能点: <points></white>"
    maxed: "已达到最高阶级"
    btn_upgrade: "<green>升级 (消耗 1 点)</green>"
    btn_back: "<white>返回</white>"

  switch_tree:
    title: "<white>切换技能流派</white>"
    body: "<white>当前流派: <current_tree></white><newline><newline><white>切换流派将无损退还所有已投入的技能点，并解锁该流派下的全部特技。</white>"
    btn_tree: "<white><tree></white>"
    btn_back: "<white>返回</white>"

  reset_points:
    title: "<white>重置技能点</white>"
    body: "<white>您确定要重置并退还所有已投入的技能点吗？所有特技将重置为 0 阶。</white>"
    btn_confirm: "<red>重置所有技能点</red>"
    btn_cancel: "<white>取消</white>"

