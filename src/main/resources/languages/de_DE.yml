    btn_pet: "<white><name> St.<level></white>"
    btn_prev: "<white>Vorherige Seite</white>"
    btn_next: "<white>Naechste Seite</white>"
    btn_back: "<white>Zurueck</white>"

  detail:
    title: "<white>Haustierdetails</white>"
