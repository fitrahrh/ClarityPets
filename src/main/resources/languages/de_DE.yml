prefix: "<gray>[<aqua>ClarityPets</aqua>]</gray> "

category:
  combat: "Kampf"
  utility: "Nutzen"
  support: "Unterstutzung"

mode:
  passive: "Passiv"
  defensive: "Verteidigend"
  sentry: "Wachposten"
  pocket: "Gelagert"

mode_desc:
  passive: "Folgt friedlich und greift niemals ein Ziel an."
  defensive: "Folgt treu und greift jeden an, der dich oder das Tier schaedigt."
  sentry: "Bewacht die aktuelle Position und greift Monster im Umkreis an."
  pocket: "Im Lager inaktiv."

pet:
  nametag_format: "<white><name></white> <gray>[St.<level>]</gray>"

