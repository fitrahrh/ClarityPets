    btn_summon: "<green>Beschwoeren</green>"
    btn_despawn: "<red>Wegschicken</red>"
    btn_skilltree: "<white>Talentbaum & Faehigkeiten</white>"
    btn_backpack: "<white>Haustier-Rucksack</white>"
    btn_mode: "<white>Modus aendern</white>"
    btn_treat: "<white>Leckerli geben (<daily_left> uebrig)</white>"
    btn_rename: "<white>Umbenennen</white>"
    btn_guide: "<white>Haustier-Leitfaden</white>"
    btn_release: "<red>Freilassen</red>"
    btn_back: "<white>Zurueck</white>"

  mode:
    title: "<white>Verhaltensmodus waehlen</white>"
    body: "<white>Aktueller Modus: <current_mode></white><newline><white><current_mode_desc></white><newline><newline><white>Passiv: Folgt friedlich, greift nicht an.</white><newline><white>Verteidigend: Beschuetzt dich vor Angreifern.</white><newline><white>Wachposten: Bewacht aktuellen Standort.</white>"
    btn_passive: "<white>Passiv</white>"
    btn_defensive: "<white>Verteidigend</white>"
    btn_sentry: "<white>Wachposten</white>"
    btn_back: "<white>Zurueck</white>"

  guide:
    title: "<white>Haustier-Leitfaden</white>"
    body: "<white>Willkommen zum ClarityPets-Leitfaden.</white><newline><white>Waehle unten eine Kategorie, um mehr ueber Mechaniken, Training und das Kolosseum zu erfahren.</white>"
    btn_basics: "<white>Grundlagen & Steuerung</white>"
    btn_leveling: "<white>Stufen & Leckerlis</white>"
    btn_skills: "<white>Talente & Faehigkeiten</white>"
    btn_modes: "<white>Verhaltensmodi</white>"
    btn_colosseum: "<white>Kolosseum-Arena</white>"
    btn_back: "<white>Zurueck</white>"
    basics_title: "<white>Leitfaden: Grundlagen</white>"
    basics_body: "<white>Grundprinzipien:</white><newline><white>Du kannst viele Haustiere sammeln, aber nur jeweils 1 aktives Tier beschwoeren.</white><newline><newline><white>Beschwoerung & Lager:</white><newline><white>Nutze das Lager, um deine Begleiter in die Welt zu rufen oder sicher wegzuschicken.</white><newline><newline><white>Anpassung:</white><newline><white>Benenne dein Tier jederzeit ueber das Detail-Menue um.</white>"
    leveling_title: "<white>Leitfaden: Stufen</white>"
    leveling_body: "<white>Erfahrung sammeln:</white><newline><white>Dein aktiver Begleiter erhaelt natuerlich EXP durch Ueberlebensaktivitaeten:</white><newline><white>- Monsterjagd: Besiegen von Feinden gewaehrt EXP.</white><newline><white>- Bergbau: Abbau von Erzen gewaehrt EXP.</white><newline><white>- Holzfaellen: Baumfaellen gewaehrt EXP.</white><newline><white>- Angeln: Fische fangen gewaehrt EXP.</white><newline><newline><white>Taegliche Leckerlis:</white><newline><white>Fuettere taegliche Leckerlis im Menue fuer sofortige Erfahrungsspruenge.</white>"
    skills_title: "<white>Leitfaden: Faehigkeiten</white>"
    skills_body: "<white>Talentbaeume & Faehigkeiten:</white><newline><white>Jedes Haustier gehoert zu einem Archetyp: Juggernaut (Kampf), Guardian (Schutz/Support) oder Scavenger (Nutzen).</white><newline><newline><white>Faehigkeitspunkte:</white><newline><white>Mit jedem Stufenaufstieg erhaelt dein Begleiter 1 Punkt. Maximiere Talente bis Rang 5.</white><newline><newline><white>Talentbaum-Wechsel:</white><newline><white>Du kannst den Archetyp jederzeit frei wechseln. Alle investierten Punkte werden automatisch erstattet.</white>"
    modes_title: "<white>Leitfaden: Verhaltensmodi</white>"
    modes_body: "<white>Verhaltensmodi:</white><newline><white>Passe das Verhalten deines Begleiters jederzeit an:</white><newline><newline><white>Passiver Modus:</white><newline><white>Folgt dir friedlich und nimmt an keinem Kampf teil.</white><newline><newline><white>Verteidigungsmodus:</white><newline><white>Gleicht Angriffe gegen dich oder sich selbst sofort aus.</white><newline><newline><white>Wachpostenmodus:</white><newline><white>Sichert das aktuelle Areal und bekaempft nahe Feinde.</white>"
    colosseum_title: "<white>Leitfaden: Kolosseum</white>"
    colosseum_body: "<white>Automatische Kolosseum-Duelle:</white><newline><white>Fordere andere Spieler heraus. Die Haustiere kaempfen vollautomatisch in der Arena.</white><newline><newline><white>Kategorievorteile:</white><newline><white>- Kampf verursacht +20 Prozent Schaden an Nutzen.</white><newline><white>- Nutzen verursacht +20 Prozent Schaden an Unterstuetzung.</white><newline><white>- Unterstuetzung verursacht +20 Prozent Schaden an Kampf.</white><newline><newline><white>Taktische Haltungen:</white><newline><white>- Aggressiv: +15 Prozent Angriff, -10 Prozent Verteidigung.</white><newline><white>- Defensiv: +20 Prozent Verteidigung, hoehere Konterrate.</white><newline><white>- Ausgeglichen: Standardmaessig ausgewogene Werte.</white>"

  rename:
    title: "<white>Haustier umbenennen</white>"
    body: "<white>Gib unten einen neuen Namen fuer dein Haustier ein.</white>"
    input_label: "<white>Haustiername</white>"
    btn_confirm: "<green>Bestaetigen</green>"
    btn_cancel: "<red>Abbrechen</red>"

  release:
    title: "<white>Freilassung bestaetigen</white>"
    body: "<white>Bist du sicher, dass du <name> freilassen moechtest? Dies kann nicht rueckgaengig gemacht werden.</white>"
    btn_confirm: "<red>Bestaetigen</red>"
    btn_cancel: "<white>Abbrechen</white>"

  colosseum:
    title: "<white>Kolosseum-Arena</white>"
    body: "<white>Duell-Statistik: <wins> Siege, <losses> Niederlagen, <draws> Unentschieden</white><newline><white>Siegesserie: <streak></white><newline><white>Wertung: <rating></white><newline><white>Taktische Haltung: <stance></white>"
    btn_stance: "<white>Haltung aendern</white>"
    btn_challenge: "<white>Spieler herausfordern</white>"
    btn_back: "<white>Zurueck</white>"

  stance:
    title: "<white>Taktische Haltung waehlen</white>"
    body: "<white>Aggressiv: +15 Prozent Angriff, -10 Prozent Verteidigung</white><newline><white>Defensiv: +20 Prozent Verteidigung, erhoehte Konterchance</white><newline><white>Ausgeglichen: Standardmaessig ausgewogene Kampfwerte</white>"
    btn_aggressive: "<white>Aggressiv</white>"
    btn_defensive: "<white>Defensiv</white>"
    btn_balanced: "<white>Ausgeglichen</white>"
    btn_back: "<white>Zurueck</white>"

  challenge:
    title: "<white>Gegner auswaehlen</white>"
    body: "<white>Waehle einen Online-Spieler fuer ein automatisches Kolosseum-Duell aus.</white>"
    btn_player: "<white><player> (<pet_name> St.<pet_level>)</white>"
    btn_back: "<white>Zurueck</white>"

  skilltree:
    title: "<white>Talentbaum - <name></white>"
    body: "<white>Archetyp: <tree></white><newline><white><tree_desc></white><newline><newline><white>Verfuegbare Faehigkeitspunkte: <points></white>"
    btn_skill: "<white><skill> [Rang <tier>/<max>]</white>"
    btn_switch: "<white>Talentbaum wechseln</white>"
    btn_reset: "<red>Punkte zuruecksetzen</red>"
    btn_back: "<white>Zurueck</white>"

  skill_detail:
    title: "<white>Faehigkeit: <skill></white>"
    body: "<white>Kategorie: <category></white><newline><white><desc></white><newline><newline><white>Aktueller Rang: <tier>/<max></white><newline><white>Aktueller Effekt: <current_effect></white><newline><newline><white>Naechster Rang: <next_effect></white><newline><newline><white>Verfuegbare Punkte: <points></white>"
    maxed: "Maximaler Rang erreicht"
    btn_upgrade: "<green>Aufwerten (1 Punkt)</green>"
    btn_back: "<white>Zurueck</white>"

  switch_tree:
    title: "<white>Talentbaum wechseln</white>"
    body: "<white>Aktueller Archetyp: <current_tree></white><newline><newline><white>Beim Wechsel des Talentbaums werden alle Punkte erstattet und neue Faehigkeiten freigeschaltet.</white>"
    btn_tree: "<white><tree></white>"
    btn_back: "<white>Zurueck</white>"

  reset_points:
    title: "<white>Punkte zuruecksetzen</white>"
    body: "<white>Moechtest du wirklich alle Talentpunkte zuruecksetzen? Alle Faehigkeiten fallen auf Rang 0 zurueck.</white>"
    btn_confirm: "<red>Alle Punkte zuruecksetzen</red>"
    btn_cancel: "<white>Abbrechen</white>"

