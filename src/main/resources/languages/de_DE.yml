    status_stored: "Gelagert"
    btn_storage: "<white>Haustierlager</white>"
    btn_colosseum: "<white>Kolosseum</white>"
    btn_guide: "<white>Haustier-Leitfaden</white>"
    btn_skilltree: "<white>Talentbaum & Faehigkeiten</white>"
    btn_backpack: "<white>Haustier-Rucksack</white>"
    btn_summon: "<green>Beschwoeren</green>"
    btn_despawn: "<red>Wegschicken</red>"
    btn_close: "<white>Schliessen</white>"

  storage:
    title: "<white>Haustierlager</white>"
